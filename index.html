<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地方競馬 自動投票の記録</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="AI の予想で地方競馬を自動で買った、実際の収支と買い目の記録">
<meta name="theme-color" content="#0b1430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* ナイター競馬の電光掲示板。数字はドットの琥珀色、買い目は馬券の形、当たりには「的中」のはんこ。1列で上から 掲示板 → 推移 → 日ごと → 馬券 */
:root{
  --night:#0b1430; --night2:#111d42; --board:#060b1c; --line:#22305e; --line2:#2d3d73;
  --ink:#e9ecf5; --dim:#8f99bd; --amber:#ffb238; --amber-glow:rgba(255,178,56,.35);
  --win:#ff5a4f; --lose:#6ea8ff; --turf:#2f9e6b; --paper:#f5f1e6; --paper-ink:#1d1a14; --paper-dim:#7b7464; --seal:#d4271c;
  --dot:"DotGothic16","Courier New",monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -120px,#1c2b63 0%,rgba(28,43,99,0) 70%),var(--night);color:var(--ink);font:15px/1.7 var(--sans);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
.num{font-family:var(--dot);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* 見出し */
.top{display:flex;flex-direction:column;gap:6px}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;letter-spacing:.18em}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--turf);box-shadow:0 0 0 0 rgba(47,158,107,.6);animation:live 2s infinite}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(47,158,107,0)}100%{box-shadow:0 0 0 0 rgba(47,158,107,0)}}
h1{margin:0;font-weight:900;font-size:clamp(26px,6vw,40px);line-height:1.2;letter-spacing:.04em;text-wrap:balance}
.sub{margin:0;color:var(--dim);font-size:13px}

/* 掲示板 */
.board{background:linear-gradient(180deg,#0a1126,#05091a);border:1px solid var(--line2);border-radius:14px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 20px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background-clip:padding-box;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.2px);background-size:4px 4px;pointer-events:none}
.cell{padding:12px 14px;border-radius:8px;background:rgba(17,29,66,.55);display:flex;flex-direction:column;gap:2px;min-width:0}
.cell .k{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.cell .v{font-family:var(--dot);font-size:clamp(26px,5.4vw,34px);line-height:1.15;color:var(--amber);text-shadow:0 0 12px var(--amber-glow);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .v.win{color:var(--win);text-shadow:0 0 12px rgba(255,90,79,.35)}
.cell .v.lose{color:var(--lose);text-shadow:0 0 12px rgba(110,168,255,.35)}
.cell .s{font-size:11.5px;color:var(--dim)}
.cell.main{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;background:rgba(17,29,66,.8)}
.cell.main .v{font-size:clamp(40px,10vw,64px)}

/* 見出しと箱 */
h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.22em;color:var(--dim);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{background:rgba(17,29,66,.6);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.scroll{overflow-x:auto}
.note{color:var(--dim);font-size:12px;margin:8px 0 0}
#chart svg{display:block;width:100%;height:auto}

/* 日ごとの表 */
table{border-collapse:collapse;width:100%}
.days th,.days td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.days th{font-size:11px;letter-spacing:.1em;color:var(--dim);font-weight:500}
.days td{font-family:var(--dot);font-size:15px}
.days th:first-child,.days td:first-child{text-align:left}
.days tr:last-child td{border-bottom:0}
.win{color:var(--win)} .lose{color:var(--lose)}

/* 馬券 */
.day-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;font-weight:700}
.day-h:first-child{margin-top:0}
.day-h .d{font-family:var(--dot);font-size:20px;color:var(--amber)}
.day-h .w{color:var(--dim);font-size:12px}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.ticket{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px 12px;min-width:0;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right/51% 100% no-repeat;
  box-shadow:0 10px 24px rgba(0,0,0,.35)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--turf) 0 14px,#25845a 14px 28px);border-radius:6px 6px 0 0}
.t-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.t-head .ven{font-weight:900;font-size:18px;letter-spacing:.06em}
.t-head .r{font-family:var(--dot);font-size:18px;background:var(--paper-ink);color:var(--paper);padding:0 6px;border-radius:3px}
.t-head .at{margin-left:auto;font-size:11px;color:var(--paper-dim);font-family:var(--dot)}
.t-name{font-size:12px;color:var(--paper-dim);margin:2px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-rows{border-top:1px dashed #c9c0aa;padding-top:6px}
.t-rows table td{padding:4px 0;font-size:13px;vertical-align:baseline}
.t-rows .kind{font-weight:700;width:3.6em}
.t-rows .nums{font-family:var(--dot);font-size:15px}
.t-rows .yen,.t-rows .od,.t-rows .res{text-align:right;font-family:var(--dot);white-space:nowrap;padding-left:8px}
.t-rows .od{color:var(--paper-dim);font-size:12px}
.t-rows .res.paid{color:var(--seal);font-weight:700}
.t-foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed #c9c0aa;margin-top:6px;padding-top:6px;font-size:12px;color:var(--paper-dim)}
.t-foot b{font-family:var(--dot);font-size:17px;color:var(--paper-ink);font-weight:400}
.t-foot b.win{color:var(--seal)}
.t-foot b.lose{color:#2a5bb5}
.seal{position:absolute;right:62px;top:6px;width:58px;height:58px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);display:grid;place-items:center;font-weight:900;font-size:16px;letter-spacing:.06em;transform:rotate(-14deg);opacity:.85;
  box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--seal);mix-blend-mode:multiply;pointer-events:none}
.wait{position:absolute;right:14px;top:44px;font-size:11px;letter-spacing:.12em;color:var(--paper-dim);border:1px solid #c9c0aa;border-radius:999px;padding:1px 10px;background:var(--paper)}
@media (prefers-reduced-motion:no-preference){.seal{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}@keyframes stamp{from{transform:rotate(-14deg) scale(1.8);opacity:0}}}
@media (prefers-reduced-motion:reduce){.eyebrow i{animation:none}}

/* 入出金 */
.cash td{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.cash td:last-child{text-align:right;font-family:var(--dot)}
.cash tr:last-child td{border-bottom:0}
.empty{color:var(--dim);font-size:13px;padding:6px 0}
footer{color:var(--dim);font-size:12px;line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow"><i></i><span>AI × 地方競馬 ／ SPAT4 実投票</span></div>
    <h1>自動投票の記録</h1>
    <p class="sub"><span id="since">—</span>から、AI の予想で実際に買った馬券をすべて載せています。<span id="updated"></span></p>
  </header>

  <section class="board" id="board" aria-label="成績の掲示板"></section>

  <section>
    <h2>残高の推移</h2>
    <div class="panel"><div id="chart"></div><p class="note">日の終わりの残高（入金・出金も含む）。左端は記録の始まる前の残高です。</p></div>
  </section>

  <section>
    <h2>日ごとの収支</h2>
    <div class="panel scroll"><table class="days" id="days"><thead><tr><th>日付</th><th>レース</th><th>点数</th><th>購入</th><th>払戻</th><th>損益</th><th>回収率</th><th>的中</th></tr></thead><tbody></tbody></table></div>
  </section>

  <section>
    <h2>買った馬券</h2>
    <div id="races"></div>
  </section>

  <section>
    <h2>入金・出金</h2>
    <div class="panel"><table class="cash" id="cash"><tbody></tbody></table></div>
  </section>

  <footer>買い目は発走の約3分前に自動で決めて SPAT4 から買っています（単勝・複勝・馬連・ワイド・3連複）。オッズは買ったときの値、払戻は確定後の金額です。過去の成績は、これからの成績を約束するものではありません。</footer>
</div>

<script>
const yen = (v) => Math.round(v).toLocaleString('ja-JP');
const sgn = (v) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(Math.round(v)).toLocaleString('ja-JP');
const cls = (v) => v > 0 ? 'win' : v < 0 ? 'lose' : '';
const md = (d) => `${+d.slice(4, 6)}/${+d.slice(6, 8)}`;
const WD = '日月火水木金土';
const wd = (d) => WD[new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)).getDay()];
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else e.setAttribute(k, v); } for (const c of kids) if (c != null) e.append(c); return e; };

function board(d) {
  const t = d.total, net = t.payout - t.stake, b = document.getElementById('board'); b.textContent = '';
  const today = d.days.length ? d.days[d.days.length - 1] : null;
  const cell = (k, v, s, c = '', extra = '') => el('div', {class: 'cell ' + extra}, el('div', {class: 'k'}, k), el('div', {class: 'v ' + c}, v), s ? el('div', {class: 's'}, s) : null);
  const spat = d.balance.spat_at ? `SPAT4 で確かめた残高 ${yen(d.balance.spat)}円（${md(d.balance.spat_at.replace(/-/g, '').slice(0, 8))} ${d.balance.spat_at.slice(11, 16)}）` : '';
  const main = el('div', {class: 'cell main'}, el('div', {}, el('div', {class: 'k'}, '残高'), el('div', {class: 'v'}, yen(d.balance.tool) + '円')), el('div', {class: 's'}, spat));
  b.append(main);
  if (today) { const n = today.payout - today.stake; b.append(cell(`${md(today.date)}（${wd(today.date)}）の損益`, sgn(n), `${today.races}レース・${today.points}点` + (today.pending ? `・結果待ち ${today.pending}点` : ''), cls(n))); }
  b.append(cell('累計の損益', sgn(net), `購入 ${yen(t.stake)}円 → 払戻 ${yen(t.payout)}円`, cls(net)));
  b.append(cell('回収率', t.done_stake ? Math.round(t.payout / t.done_stake * 100) + '%' : '—', '結果の出た馬券で計算'));
  b.append(cell('的中', `${t.hits}/${t.races}`, `レース（${t.points}点）`));
}

function chart(d) {
  const box = document.getElementById('chart'); box.textContent = '';
  const pts = d.curve;
  if (pts.length < 2) { box.append(el('p', {class: 'empty'}, 'まだ1日分の記録がありません。最初の日が終わると線が出ます。')); return; }
  const W = 680, H = 230, L = 52, R = 24, T = 18, B = 30;
  const vals = pts.map((p) => p.balance), lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max(1000, (hi - lo) * .15);
  const y0 = Math.max(0, Math.floor((lo - pad) / 1000) * 1000), y1 = Math.ceil((hi + pad) / 1000) * 1000;
  const x = (i) => L + (W - L - R) * (i / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', '残高の推移');
  const add = (tag, a, parent = svg) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); parent.append(e); return e; };
  const defs = add('defs', {}); const g = add('linearGradient', {id: 'fill', x1: 0, y1: 0, x2: 0, y2: 1}, defs);
  [[0, .35], [1, 0]].forEach(([o, a]) => add('stop', {offset: o, 'stop-color': '#ffb238', 'stop-opacity': a}, g));
  const step = Math.max(1000, Math.ceil((y1 - y0) / 4 / 1000) * 1000);
  for (let v = y0; v <= y1; v += step) {
    add('line', {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: '#22305e', 'stroke-dasharray': '2 4'});
    add('text', {x: L - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 12, fill: '#8f99bd', 'font-family': 'DotGothic16, monospace'}).textContent = (v / 10000).toLocaleString('ja-JP', {maximumFractionDigits: 1}) + '万';
  }
  const every = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) add('text', {x: x(i), y: H - 8, 'text-anchor': 'middle', 'font-size': 12, fill: '#8f99bd', 'font-family': 'DotGothic16, monospace'}).textContent = p.date === 'start' ? '開始' : md(p.date); });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.balance)}`).join('');
  add('path', {d: `${line}L${x(pts.length - 1)},${H - B}L${x(0)},${H - B}Z`, fill: 'url(#fill)'});
  add('path', {d: line, fill: 'none', stroke: '#ffb238', 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', style: 'filter:drop-shadow(0 0 6px rgba(255,178,56,.55))'});
  pts.forEach((p, i) => { const c = add('circle', {cx: x(i), cy: y(p.balance), r: i === pts.length - 1 ? 5 : 3.5, fill: i === pts.length - 1 ? '#ffb238' : '#0b1430', stroke: '#ffb238', 'stroke-width': 2}); const t = document.createElementNS(ns, 'title'); t.textContent = `${p.date === 'start' ? '開始' : md(p.date)}　${yen(p.balance)}円`; c.append(t); });
  const last = pts[pts.length - 1];
  add('text', {x: x(pts.length - 1) - 8, y: y(last.balance) - 12, 'text-anchor': 'end', 'font-size': 15, fill: '#ffb238', 'font-family': 'DotGothic16, monospace'}).textContent = yen(last.balance) + '円';
  box.append(svg);
}

function days(d) {
  const tb = document.querySelector('#days tbody'); tb.textContent = '';
  if (!d.days.length) { tb.append(el('tr', {}, el('td', {colspan: 8, class: 'empty'}, 'まだ買った日がありません。'))); return; }
  for (const x of [...d.days].reverse()) {
    const n = x.payout - x.stake;
    tb.append(el('tr', {}, el('td', {}, `${md(x.date)}（${wd(x.date)}）`), el('td', {}, String(x.races)), el('td', {}, String(x.points)), el('td', {}, yen(x.stake)), el('td', {}, yen(x.payout)),
      el('td', {class: cls(n)}, sgn(n)), el('td', {}, x.done_stake ? Math.round(x.payout / x.done_stake * 100) + '%' : '—'), el('td', {}, String(x.hits))));
  }
}

function races(d) {
  const box = document.getElementById('races'); box.textContent = '';
  if (!d.races.length) { box.append(el('div', {class: 'panel'}, el('p', {class: 'empty'}, 'まだ買ったレースがありません。発走の約3分前に買い目が決まると、ここに馬券が出ます。'))); return; }
  let day = null, grid = null;
  for (const r of d.races) {
    if (r.date !== day) {
      day = r.date;
      box.append(el('div', {class: 'day-h'}, el('span', {class: 'd'}, `${+day.slice(4, 6)}.${String(+day.slice(6, 8)).padStart(2, '0')}`), el('span', {class: 'w'}, `${wd(day)}曜日`)));
      grid = el('div', {class: 'tickets'}); box.append(grid);
    }
    const n = r.payout - r.stake;
    const rows = el('tbody');
    for (const b of r.bets) rows.append(el('tr', {}, el('td', {class: 'kind'}, b.kind), el('td', {class: 'nums'}, b.nums), el('td', {class: 'od'}, b.odds != null ? b.odds + '倍' : ''),
      el('td', {class: 'yen'}, yen(b.stake)), el('td', {class: 'res' + (b.payout ? ' paid' : '')}, b.done ? (b.payout ? yen(b.payout) : (b.finish ? b.finish + '着' : '0')) : '…')));
    const t = el('article', {class: 'ticket'},
      el('div', {class: 't-head'}, el('span', {class: 'ven'}, r.venue), el('span', {class: 'r'}, `${r.num}R`), el('span', {class: 'at'}, r.ts)),
      el('div', {class: 't-name'}, r.name),
      el('div', {class: 't-rows'}, el('table', {}, rows)),
      el('div', {class: 't-foot'}, el('span', {}, `購入 ${yen(r.stake)}円`), r.pending ? el('span', {}, '結果待ち') : el('b', {class: cls(n)}, sgn(n) + '円')));
    if (!r.pending && r.payout > 0) t.append(el('div', {class: 'seal', 'aria-label': '的中'}, '的中'));
    if (r.pending) t.append(el('div', {class: 'wait'}, '発走待ち'));
    grid.append(t);
  }
}

function cash(d) {
  const tb = document.querySelector('#cash tbody'); tb.textContent = '';
  if (!d.cash.length) { tb.append(el('tr', {}, el('td', {class: 'empty'}, '記録の期間中の入金・出金はありません。'))); return; }
  for (const c of [...d.cash].reverse()) tb.append(el('tr', {}, el('td', {}, `${md(c.ts.replace(/-/g, '').slice(0, 8))} ${c.ts.slice(11, 16)}　${c.kind === 'deposit' ? '入金' : '出金'}`), el('td', {}, (c.kind === 'deposit' ? '+' : '−') + yen(c.amount) + '円')));
}

fetch('data.json', {cache: 'no-store'}).then((r) => r.json()).then((d) => {
  document.getElementById('since').textContent = `${+d.since.slice(0, 4)}年${+d.since.slice(4, 6)}月${+d.since.slice(6, 8)}日`;
  document.getElementById('updated').textContent = d.updated ? `（最終更新 ${+d.updated.slice(5, 7)}/${+d.updated.slice(8, 10)} ${d.updated.slice(11)}）` : '';
  board(d); chart(d); days(d); races(d); cash(d);
}).catch(() => { document.getElementById('races').textContent = '記録を読み込めませんでした。少し待ってから開き直してください。'; });
</script>
</body>
</html>
