<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>地方競馬 自動投票の記録</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="AI の予想で地方競馬を自動で買った、実際の収支と買い目の記録">
<meta name="theme-color" content="#8a3b12">
<style>
/* 出馬表ツールと同じ茶色の帯。生成りの地に、大きな数字4つ → 馬券のカード → 日ごとの表 → 残高の線 → 入出金 */
:root{
  --brown:#8a3b12; --brown-dark:#6a2c0c; --bg:#f6f1ea; --card:#ffffff; --fg:#2a211b; --muted:#7a6e64; --line:#e6dccf;
  --win:#c62828; --lose:#1e5aa8; --hit-bg:#fff4f2; --seal:#d0281d;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --brown:#7a3510; --brown-dark:#5a260a; --bg:#1b1714; --card:#26201b; --fg:#f1ebe4; --muted:#ab9f94; --line:#3a312a;
  --win:#ff7366; --lose:#6aa8ff; --hit-bg:#33211d; --seal:#ff5a4c; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--sans)}
.band{background:var(--brown);color:#fff;border-bottom:4px solid var(--brown-dark)}
.band .in{max-width:1240px;margin:0 auto;padding-block:16px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band h1{margin:0;font-size:22px;letter-spacing:.04em}
.band p{margin:2px 0 0;font-size:13px;opacity:.85}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
h2{margin:0 0 10px;font-size:17px;padding-left:10px;border-left:4px solid var(--brown)}
.win{color:var(--win)} .lose{color:var(--lose)}

.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sum .k{font-size:13px;color:var(--muted)}
.sum .v{font-size:26px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.sum .s{font-size:12px;color:var(--muted)}

.day-h{font-weight:700;color:var(--brown);margin:18px 0 8px}
.day-h:first-child{margin-top:0}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 10px;min-width:0;overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--brown)}
.ticket::after{content:"";position:absolute;left:-8px;right:-8px;top:calc(50% - 7px);height:14px;pointer-events:none;
  background:radial-gradient(circle 7px at 0 50%,var(--bg) 6.5px,var(--line) 7px,transparent 7.5px) left/16px 14px no-repeat,radial-gradient(circle 7px at 100% 50%,var(--bg) 6.5px,var(--line) 7px,transparent 7.5px) right/16px 14px no-repeat}
.ticket.hit{background:var(--hit-bg)}
.t-head{display:flex;align-items:center;gap:8px;margin-top:4px}
.t-head .ven{font-weight:700;font-size:18px}
.t-head .r{font-weight:700;background:var(--brown);color:#fff;border-radius:4px;padding:0 7px;font-size:15px}
.t-head .at{margin-left:auto;font-size:12px;color:var(--muted)}
.t-name{font-size:12px;color:var(--muted);margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:112px}
.t-rows{border-top:1px dashed var(--line);padding-top:4px}
.t-rows table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t-rows td{padding:4px 0;font-size:14px;white-space:nowrap}
.t-rows .kind{font-weight:700;width:3.4em}
.t-rows .od{color:var(--muted);font-size:12px;text-align:right}
.t-rows .yen,.t-rows .res{text-align:right;padding-left:10px}
.t-rows .res.paid{color:var(--win);font-weight:700}
.t-foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-size:13px;color:var(--muted)}
.t-foot b{font-size:18px;font-variant-numeric:tabular-nums}
.seal{position:absolute;right:58px;top:6px;width:48px;height:48px;border:3px solid var(--seal);border-radius:50%;color:var(--seal);display:grid;place-items:center;font-weight:900;font-size:14px;transform:rotate(-12deg);opacity:.85;pointer-events:none;box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 4px var(--seal)}
.ticket.hit .seal{box-shadow:inset 0 0 0 2px var(--hit-bg),inset 0 0 0 4px var(--seal)}
.wait{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 10px}

.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12px;color:var(--muted);font-weight:400}
.tbl th:first-child,.tbl td:first-child{text-align:left}
#chart svg{display:block;width:100%;height:auto}
.empty{color:var(--muted);font-size:14px;margin:4px 0}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
/* 買った馬券以外は1画面に収める（2026-10-23 ユーザー）：表は横にはみ出さず、長くなったら枠の中だけ縦にスクロール */
.info{display:flex;flex-direction:column;gap:16px;min-width:0}
.info h2{margin-bottom:6px}
.list{overflow-y:auto;max-height:190px;padding-block:4px}
.list.short{max-height:110px}
.list thead th{position:sticky;top:0;background:var(--card)}
@media (max-width:480px){
  .tbl th,.tbl td{padding:5px 3px;font-size:13px}
  .sum{padding:8px 10px} .sum .v{font-size:21px}
  .summary{gap:8px}
}
/* 買った馬券は小さめの券に（2026-10-23 ユーザー「こんな大きく表示しなくていい」） */
.tickets{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.ticket{padding:8px 10px 6px}
.ticket::before{height:4px}
.t-head .ven{font-size:15px} .t-head .r{font-size:13px}
.t-name{font-size:11px;margin:0 0 4px;padding-right:80px}
.t-rows td{padding:2px 0;font-size:13px}
.t-foot{font-size:12px;padding-top:4px} .t-foot b{font-size:15px}
.seal{width:36px;height:36px;font-size:11px;right:46px;top:4px;border-width:2px}
.day-h{margin:12px 0 6px;font-size:14px}
.band .summary{margin-top:12px;color:var(--fg)}
.days tbody tr{cursor:pointer}
.days tbody tr:hover td{background:var(--hit-bg)}
.days tbody tr.sel td{background:var(--hit-bg);font-weight:700}
.days tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--brown)}
.hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
@media (min-width:1000px){
  /* 上の帯：左に題名、右（空いていた所）に残高・損益のまとめ（2026-10-23 ユーザー「上の余白右側うまいこと使って」） */
  .band .in{max-width:1240px;padding-block:8px;display:flex;align-items:center;gap:24px}
  .band h1{font-size:18px} .band p{font-size:12px}
  .band .summary{margin:0 0 0 auto;grid-template-columns:repeat(4,minmax(150px,auto));gap:6px}
  .sum{padding:5px 12px} .sum .k,.sum .s{font-size:11px} .sum .v{font-size:20px;line-height:1.25}
  /* 左：日ごとの収支・入金出金、右：グラフ（空いた高さを全部使う）と、えらんだ日の馬券 */
  .wrap{max-width:1240px;display:grid;grid-template-columns:380px 1fr;align-items:start;gap:16px 24px;padding-top:12px;padding-bottom:16px}
  .info{gap:8px} .right{display:flex;flex-direction:column;gap:12px;min-width:0}
  h2{font-size:14px;margin-bottom:4px}
  .box{padding:6px 12px}
  .tbl th,.tbl td{padding:4px 4px;font-size:13px}
  .list.short{max-height:70px}
  .note{margin-top:2px}
  .info .days{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .info .days .list{max-height:none;flex:1 1 auto;min-height:60px}
  .tickets{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
}
/* パソコンでは画面ぴったりに収め、ページはスクロールしない */
@media (min-width:1000px) and (min-height:560px){
  body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .wrap{flex:1 1 auto;min-height:0;width:100%;grid-template-rows:minmax(0,1fr)}
  .info,.right{align-self:stretch;min-height:0;overflow:hidden}
  .graph{flex:1 1 auto;min-height:170px;display:flex;flex-direction:column}
  .graph .box{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #chart{flex:1 1 auto;min-height:0;position:relative}
  #chart svg{position:absolute;inset:0;width:100%;height:100%}
  .bought{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
  #races{min-height:0;overflow-y:auto}
}
</style>
</head>
<body>
<header class="band"><div class="in">
  <div><h1>地方競馬 自動投票の記録</h1>
  <p>AI の予想で実際に買った記録（<span id="since">—</span>から）<span id="updated"></span></p></div>
  <section class="summary" id="summary"></section>
</div></header>

<div class="wrap">
  <div class="info">
    <section class="days">
      <h2>日ごとの収支</h2>
      <div class="box list"><table class="tbl" id="days"><thead><tr><th>日付</th><th>レース</th><th>購入</th><th>払戻</th><th>損益</th><th>回収率</th></tr></thead><tbody></tbody></table></div>
    </section>

    <section>
      <h2>入金・出金</h2>
      <div class="box list short"><table class="tbl" id="cash"><tbody></tbody></table></div>
    </section>

  </div>

  <div class="right">
  <section class="graph">
    <h2>残高の推移</h2>
    <div class="box"><div id="chart"></div><p class="note">その日の終わりの残高（入金・出金を含む）</p></div>
  </section>

  <section class="bought">
    <h2 id="bought-h">買った馬券</h2>
    <div id="races"></div>
  </section>
  </div>
</div>

<script>
const yen = (v) => Math.round(v).toLocaleString('ja-JP') + '円';
const sgn = (v) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(Math.round(v)).toLocaleString('ja-JP') + '円';
const cls = (v) => v > 0 ? 'win' : v < 0 ? 'lose' : '';
const md = (d) => `${+d.slice(4, 6)}/${+d.slice(6, 8)}`;
const wd = (d) => '日月火水木金土'[new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)).getDay()];
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else e.setAttribute(k, v); } for (const c of kids) if (c != null) e.append(c); return e; };

function summary(d) {
  const t = d.total, net = t.payout - t.stake, box = document.getElementById('summary'); box.textContent = '';
  const today = d.days.length ? d.days[d.days.length - 1] : null;
  const sum = (k, v, s, c = '') => el('div', {class: 'sum'}, el('div', {class: 'k'}, k), el('div', {class: 'v ' + c}, v), el('div', {class: 's'}, s));
  box.append(sum('残高', yen(d.balance.tool), d.balance.spat_at ? 'SPAT4 の残高と照合ずみ' : ''));
  const tn = today ? today.payout - today.stake : 0;
  box.append(sum(today ? `${md(today.date)}（${wd(today.date)}）の損益` : '今日の損益', today ? sgn(tn) : '—', today ? `${today.races}レース` + (today.pending ? `・結果待ち${today.pending}点` : '') : 'まだ買っていません', cls(tn)));
  box.append(sum('累計の損益', sgn(net), `購入 ${yen(t.stake)}`, cls(net)));
  box.append(sum('回収率', t.done_stake ? Math.round(t.payout / t.done_stake * 100) + '%' : '—', `的中 ${t.hits} / ${t.races}レース`));
}

let sel = null;   // 馬券を出す日。日ごとの収支の行を押すと切り替わる（はじめは最新の日）

function races(d) {
  const box = document.getElementById('races'); box.textContent = '';
  if (!d.races.length) { box.append(el('p', {class: 'empty'}, 'まだ買ったレースはありません。')); return; }
  sel = sel || d.races[0].date;
  const h = document.getElementById('bought-h'); h.textContent = `買った馬券　${md(sel)}（${wd(sel)}）`;
  if (d.days.length > 1) h.append(el('span', {class: 'hint'}, '日ごとの収支の行を押すと、その日の馬券に切り替わります'));
  const grid = el('div', {class: 'tickets'}); box.append(grid);
  for (const r of d.races.filter((r) => r.date === sel)) {
    const n = r.payout - r.stake, hit = !r.pending && r.payout > 0;
    const rows = el('tbody');
    for (const b of r.bets) rows.append(el('tr', {}, el('td', {class: 'kind'}, b.kind), el('td', {}, b.nums), el('td', {class: 'od'}, b.odds != null ? b.odds + '倍' : ''),
      el('td', {class: 'yen'}, yen(b.stake)), el('td', {class: 'res' + (b.payout ? ' paid' : '')}, b.done ? (b.payout ? '→ ' + yen(b.payout) : (b.finish ? b.finish + '着' : '—')) : '')));
    const t = el('article', {class: 'ticket' + (hit ? ' hit' : '')},
      el('div', {class: 't-head'}, el('span', {class: 'ven'}, r.venue), el('span', {class: 'r'}, `${r.num}R`), r.pending ? el('span', {class: 'wait'}, '発走待ち') : null, el('span', {class: 'at'}, r.ts)),
      el('div', {class: 't-name'}, r.name),
      el('div', {class: 't-rows'}, el('table', {}, rows)),
      el('div', {class: 't-foot'}, el('span', {}, `購入 ${yen(r.stake)}`), r.pending ? el('span', {}, '結果待ち') : el('b', {class: cls(n)}, sgn(n))));
    if (hit) t.append(el('div', {class: 'seal', 'aria-label': '的中'}, '的中'));
    grid.append(t);
  }
}

function days(d) {
  const tb = document.querySelector('#days tbody'); tb.textContent = '';
  if (!d.days.length) { tb.append(el('tr', {}, el('td', {colspan: 6, class: 'empty'}, 'まだ記録がありません。'))); return; }
  for (const x of [...d.days].reverse()) {
    const n = x.payout - x.stake;
    const tr = el('tr', {class: x.date === sel ? 'sel' : ''}, el('td', {}, `${md(x.date)}（${wd(x.date)}）`), el('td', {}, `${x.races}`), el('td', {}, yen(x.stake)), el('td', {}, yen(x.payout)),
      el('td', {class: cls(n)}, sgn(n)), el('td', {}, x.done_stake ? Math.round(x.payout / x.done_stake * 100) + '%' : '—'));
    tr.addEventListener('click', () => { sel = x.date; races(d); days(d); chart(d); });
    tb.append(tr);
  }
}

function chart(d) {
  const box = document.getElementById('chart'); box.textContent = '';
  const pts = d.curve;
  if (pts.length < 2) { box.append(el('p', {class: 'empty'}, '1日分の記録がたまると、ここに線が出ます。')); return; }
  const fit = matchMedia('(min-width:1000px) and (min-height:560px)').matches;   // パソコンでは枠の大きさいっぱいに描く（文字の大きさはそろえる）
  const W = Math.max(300, box.clientWidth || 640), H = fit ? Math.max(120, box.clientHeight) : 220,
        L = 56, R = 16, T = 16, B = 26;
  const vals = pts.map((p) => p.balance), lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max(1000, (hi - lo) * .15);
  const y0 = Math.max(0, Math.floor((lo - pad) / 1000) * 1000), y1 = Math.ceil((hi + pad) / 1000) * 1000;
  const x = (i) => L + (W - L - R) * (i / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', '残高の推移');
  const add = (tag, a) => { const e = document.createElementNS(ns, tag); for (const k in a) e.setAttribute(k, a[k]); svg.append(e); return e; };
  const step = Math.max(1000, Math.ceil((y1 - y0) / 4 / 1000) * 1000);
  for (let v = y0; v <= y1; v += step) {
    add('line', {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--line)'});
    add('text', {x: L - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 13, fill: 'var(--muted)'}).textContent = (v / 10000).toLocaleString('ja-JP', {maximumFractionDigits: 1}) + '万';
  }
  const every = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => { if (i % every === 0 || i === pts.length - 1) add('text', {x: x(i), y: H - 6, 'text-anchor': 'middle', 'font-size': 13, fill: 'var(--muted)'}).textContent = p.date === 'start' ? '開始' : md(p.date); });
  add('path', {d: pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.balance)}`).join(''), fill: 'none', stroke: 'var(--brown)', 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
  pts.forEach((p, i) => add('circle', {cx: x(i), cy: y(p.balance), r: 4, fill: 'var(--brown)'}));
  const last = pts[pts.length - 1];
  add('text', {x: x(pts.length - 1), y: y(last.balance) - 10, 'text-anchor': 'end', 'font-size': 14, 'font-weight': 700, fill: 'var(--fg)'}).textContent = yen(last.balance);
  box.append(svg);
}

function cash(d) {
  const tb = document.querySelector('#cash tbody'); tb.textContent = '';
  if (!d.cash.length) { tb.append(el('tr', {}, el('td', {class: 'empty'}, 'この期間の入金・出金はありません。'))); return; }
  for (const c of [...d.cash].reverse()) tb.append(el('tr', {}, el('td', {}, `${md(c.ts.replace(/-/g, '').slice(0, 8))} ${c.ts.slice(11, 16)}`), el('td', {}, c.kind === 'deposit' ? '入金' : '出金'), el('td', {}, yen(c.amount))));
}

fetch('data.json', {cache: 'no-store'}).then((r) => r.json()).then((d) => {
  document.getElementById('since').textContent = `${+d.since.slice(4, 6)}月${+d.since.slice(6, 8)}日`;
  document.getElementById('updated').textContent = d.updated ? `・${+d.updated.slice(5, 7)}/${+d.updated.slice(8, 10)} ${d.updated.slice(11)} 更新` : '';
  summary(d); races(d); days(d); cash(d); chart(d);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => chart(d), 200); });
}).catch(() => { document.getElementById('races').textContent = '記録を読み込めませんでした。少し待ってから開き直してください。'; });
</script>
</body>
</html>
